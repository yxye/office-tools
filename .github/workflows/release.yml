# GitHub Actions：在云端同时打包 Windows 与 macOS 安装包
# 触发方式：
#   1) 推送形如 v0.1.0 的 tag 时自动构建并生成 Release 草稿
#   2) 在 Actions 页面手动触发（workflow_dispatch）
#
# 产物：
#   - Windows：.msi（WiX）与 .exe（NSIS）
#   - macOS：.dmg（Apple Silicon 与 Intel 各一份）
#
# 说明：本仓库根目录即为 Tauri 项目根（含 package.json / src-tauri）。
# 若将 office-tools 作为某个大仓库的子目录，请给下方 tauri-action 增加
#   with: projectPath: office-tools
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write # 允许创建 Release 并上传安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # macOS：Intel
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          # Windows x64
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要两个目标架构以分别产出 Intel / Apple Silicon 包
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并打包（tauri）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅在打 tag 时创建 Release；手动触发时产物见 Actions 构建工件
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "办公工具箱 ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
