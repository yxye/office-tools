[package]
name = "office-tools"
version = "0.1.0"
description = "办公支持工具箱（PDF 文字水印等）"
authors = ["you"]
edition = "2021"

[lib]
# Tauri 应用库名，供移动端与桌面端复用
name = "office_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
